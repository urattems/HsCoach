[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthstone-replay-analyzer"
dynamic = ["version"]
description = "Extracteur factuel de replays Hearthstone HSReplay en français"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hearthstone Replay Analyzer contributors" }]
dependencies = [
    "hearthstone==9.20.10",
    "hslog==1.20.0",
    "hsreplay==1.16.2",
    "httpx>=0.28.1,<0.29",
    # hsreplay 1.16.2 importe encore pkg_resources à l'exécution.
    "setuptools>=68,<81",
]

[project.optional-dependencies]
dev = [
    "PySide6>=6.8,<6.12",
    "pytest-qt>=4.4,<5",
    "pytest>=9.0,<10",
    "ruff>=0.16,<0.17",
]
gui = [
    "PySide6>=6.8,<6.12",
]
build = [
    "PyInstaller>=6.10,<7",
    "PySide6>=6.8,<6.12",
]

[project.scripts]
hscoach = "hscoach.cli:entrypoint"

[project.gui-scripts]
hscoach-gui = "hscoach.gui:entrypoint"

[tool.setuptools.dynamic]
version = { attr = "hscoach.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
filterwarnings = [
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
