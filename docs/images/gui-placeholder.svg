<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Aperçu schématique de l’interface HSCoach</title>
  <desc id="description">Fenêtre avec dépôt de replays, URL, liste, dossier de sortie et bouton Analyser.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#e5e7eb"/>
  <rect x="72" y="44" width="1056" height="632" rx="18" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="72" y="44" width="1056" height="64" rx="18" fill="#0f172a"/>
  <rect x="72" y="88" width="1056" height="20" fill="#0f172a"/>
  <circle cx="105" cy="76" r="7" fill="#fb7185"/>
  <circle cx="129" cy="76" r="7" fill="#fbbf24"/>
  <circle cx="153" cy="76" r="7" fill="#34d399"/>
  <text x="600" y="82" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">Hearthstone Replay Analyzer</text>

  <rect x="112" y="136" width="976" height="176" rx="14" fill="#172033" stroke="#64748b" stroke-width="2" stroke-dasharray="10 8"/>
  <path d="M600 177v62m0-62-22 22m22-22 22 22" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="270" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">Glissez vos replays Hearthstone ici</text>
  <text x="600" y="296" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">.hsreplay · .xml · .txt · plusieurs fichiers acceptés</text>

  <rect x="112" y="336" width="732" height="48" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="132" y="366" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="15">URL XML directe ou lien HSReplay...</text>
  <rect x="860" y="336" width="104" height="48" rx="8" fill="#334155"/>
  <text x="912" y="366" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Ajouter</text>
  <rect x="980" y="336" width="108" height="48" rx="8" fill="#334155"/>
  <text x="1034" y="366" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600">Parcourir...</text>

  <rect x="112" y="408" width="622" height="112" rx="10" fill="#0f172a"/>
  <circle cx="142" cy="438" r="9" fill="#34d399"/>
  <text x="164" y="444" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="16">game1.hsreplay</text>
  <text x="696" y="444" text-anchor="end" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="14">Terminé</text>
  <line x1="132" y1="464" x2="714" y2="464" stroke="#334155"/>
  <circle cx="142" cy="490" r="9" fill="#60a5fa"/>
  <text x="164" y="496" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="16">game2.xml</text>
  <text x="696" y="496" text-anchor="end" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="14">Analyse en cours</text>

  <rect x="754" y="408" width="334" height="112" rx="10" fill="#0f172a"/>
  <text x="778" y="438" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14">Dossier de sortie</text>
  <rect x="778" y="452" width="286" height="40" rx="7" fill="#172033" stroke="#475569"/>
  <text x="794" y="477" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Documents\HSCoach</text>

  <text x="112" y="558" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14">☑ Résumé Markdown</text>
  <text x="312" y="558" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14">☑ JSON pour IA</text>
  <text x="474" y="558" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14">☐ JSON complet</text>
  <text x="652" y="558" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14">2 / 5 parties analysées</text>

  <rect x="112" y="588" width="976" height="56" rx="10" fill="#2563eb"/>
  <text x="600" y="623" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700" letter-spacing="1">ANALYSER</text>
</svg>
